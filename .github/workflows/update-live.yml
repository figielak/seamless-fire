name: Update near real-time data

# Daily: FIRMS global NOAA-20 near real-time file -> live/, public/data/{CC}/live.json and
# hotspots/live.csv (pipeline/live_update.py); fire activity forecast from NASA POWER and Open-Meteo
# weather -> live/forecast/state_{CC}.json, public/data/{CC}/forecast.json (pipeline/forecast_update.py).
# Commits only when the data changed, then deploys.
# A push made with GITHUB_TOKEN does not start other workflows, so the deploy is called here.

on:
  schedule:
    - cron: "30 5 * * *" # 05:30 UTC: the previous UTC day is complete in FIRMS by then
  workflow_dispatch:

concurrency:
  group: update-live
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install "pandas>=2.2" "numpy>=2.0"
      - name: Tests of the update logic
        run: python -m unittest pipeline/tests/test_live.py pipeline/tests/test_borders.py pipeline/tests/test_forecast.py
        env:
          PYTHONPATH: pipeline
      - name: Download and merge
        run: python pipeline/live_update.py
      - name: Fire activity forecast
        # Weather services down: keep the previous forecast (the site flags its date), still publish fire data.
        continue-on-error: true
        run: python pipeline/forecast_update.py
      - id: commit
        name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain live public/data)" ]; then
            echo "No new data."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          through=$(python -c "import json; print(max(v['last'] for v in json.load(open('live/coverage.json')).values()))")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live public/data
          git commit -m "Update near real-time data and forecast (through $through)"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ needs.update.outputs.sha }}
